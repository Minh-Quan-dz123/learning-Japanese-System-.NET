version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jls_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jls_user
      POSTGRES_PASSWORD: jls_password
      POSTGRES_DB: japanese_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jls_user -d japanese_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

